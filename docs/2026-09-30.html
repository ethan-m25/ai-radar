<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Radar — 2026-09-30 · №126</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: 'Geist', system-ui, -apple-system, sans-serif;
  background: oklch(0.97 0.005 260);
  color: oklch(0.18 0.02 260);
  line-height: 1.6;
  padding: 0 1rem;
}
a { color: oklch(0.45 0.18 260); text-decoration: none; }
a:hover { text-decoration: underline; }
img, svg { max-width: 100%; display: block; }
.container { max-width: 800px; margin: 0 auto; padding: 2rem 0 4rem; }

/* ── masthead ── */
.masthead {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 1.5rem 0 1rem;
  border-bottom: 2px solid oklch(0.18 0.02 260);
  margin-bottom: 2rem;
}
.masthead .logo {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 1.5rem;
  letter-spacing: -0.02em;
}
.masthead .logo .radar { color: oklch(0.55 0.2 260); }
.masthead .meta {
  font-size: 0.8rem;
  color: oklch(0.5 0.02 260);
  text-align: right;
  line-height: 1.5;
}
.masthead .meta .issue-num {
  font-weight: 600;
  color: oklch(0.18 0.02 260);
}

/* ── cover ── */
.cover {
  padding: 2rem 0 1.5rem;
  border-bottom: 1px solid oklch(0.85 0.01 260);
  margin-bottom: 2rem;
}
.cover .headline {
  font-family: 'Fraunces', serif;
  font-size: 2.4rem;
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin-bottom: 1rem;
}
.cover .counts {
  display: flex;
  gap: 1.25rem;
  font-size: 0.85rem;
  color: oklch(0.5 0.02 260);
}
.cover .counts .count { font-weight: 600; color: oklch(0.18 0.02 260); }

/* ── no signal ── */
.no-signal {
  padding: 3.5rem 1rem;
  text-align: center;
  max-width: 520px;
  margin: 0 auto;
}
.no-signal .emoji { font-size: 3rem; margin-bottom: 1rem; }
.no-signal h2 {
  font-family: 'Fraunces', serif;
  font-size: 1.5rem;
  margin-bottom: 1rem;
}
.no-signal p {
  color: oklch(0.4 0.02 260);
  margin-bottom: 0.75rem;
  font-size: 0.95rem;
}
.no-signal .mantra {
  font-weight: 600;
  color: oklch(0.3 0.02 260);
}
.no-signal .note {
  font-size: 0.8rem;
  color: oklch(0.6 0.02 260);
  margin-top: 1.5rem;
}

/* ── footer ── */
.site-footer {
  margin-top: 3rem;
  padding-top: 1.5rem;
  border-top: 1px solid oklch(0.85 0.01 260);
  font-size: 0.8rem;
  color: oklch(0.5 0.02 260);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* ── pager ── */
.pager {
  display: flex;
  justify-content: space-between;
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid oklch(0.85 0.01 260);
}
.pager a {
  font-weight: 600;
  font-size: 0.9rem;
  padding: 0.5rem 1rem;
  border: 1px solid oklch(0.8 0.02 260);
  border-radius: 6px;
  transition: all 0.15s;
}
.pager a:hover {
  background: oklch(0.9 0.01 260);
  text-decoration: none;
}
.pager .prev { margin-right: auto; }
.pager .next { margin-left: auto; }
.pager .disabled {
  opacity: 0.4;
  pointer-events: none;
}
</style>
</head>
<body>
<div class="container">
  <!-- Masthead -->
  <header class="masthead">
    <div class="logo">AI <span class="radar">Radar</span></div>
    <div class="meta">
      <div>2026-09-30 · Week 40</div>
      <div>Issue <span class="issue-num">№126</span></div>
    </div>
  </header>

  <!-- Cover -->
  <section class="cover">
    <h1 class="headline">空仓也是一种仓位：今天 0 条真信号。</h1>
    <div class="counts">
      <span class="count">0 条</span>
      <span>🚨 0</span>
      <span>👀 0</span>
      <span>ℹ️ 0</span>
    </div>
  </section>

  <!-- No signal -->
  <section class="no-signal">
    <div class="emoji">🌤️</div>
    <h2>今天没有真信号</h2>
    <p>扫描了 5 个源，所有内容都是 recap / 通稿 / 已经被中文圈覆盖。</p>
    <p class="mantra">Stay calm and keep building.</p>
    <p class="note">（注：连续 3 天无真信号是正常现象。如果连续 7 天都是 0 条，可能要重新校准阈值。）</p>
  </section>

  <!-- Top pager -->
  <nav class="pager" data-current-date="2026-09-30">
    <a class="prev" href="#">← 前一天</a>
    <a class="next" href="#">后一天 →</a>
  </nav>

  <!-- Footer -->
  <footer class="site-footer">
    <span>📡 AI Radar · 每日早报</span>
    <a href="./archive.html">📚 全部存档</a>
  </footer>

  <!-- Bottom pager -->
  <nav class="pager" data-current-date="2026-09-30">
    <a class="prev" href="#">← 前一天</a>
    <a class="next" href="#">后一天 →</a>
  </nav>
</div>

<script>
// Pager: fetch archive.json and render prev/next
(async function() {
  const pager = document.querySelector('.pager');
  if (!pager) return;
  const currentDate = pager.dataset.currentDate;
  try {
    const res = await fetch('./archive.json', { cache: 'no-store' });
    const data = await res.json();
    const issues = data.issues;
    const idx = issues.findIndex(i => i.date === currentDate);
    document.querySelectorAll('.pager').forEach(p => {
      const prevLink = p.querySelector('.prev');
      const nextLink = p.querySelector('.next');
      if (idx > 0) {
        prevLink.href = issues[idx - 1].date + '.html';
      } else {
        prevLink.classList.add('disabled');
        prevLink.removeAttribute('href');
      }
      if (idx < issues.length - 1) {
        nextLink.href = issues[idx + 1].date + '.html';
      } else {
        nextLink.classList.add('disabled');
        nextLink.removeAttribute('href');
      }
    });
  } catch (e) {
    console.warn('archive.json 加载失败，pager 不可用', e);
  }
})();
</script>
</body>
</html>
